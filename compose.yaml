name: doulaozhuang

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doulaozhuang}
      POSTGRES_USER: ${POSTGRES_USER:-doulaozhuang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env.production 中设置 POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-doulaozhuang}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-doulaozhuang}?schema=public
      JWT_SECRET: ${JWT_SECRET:?请在 .env.production 中设置 JWT_SECRET}
      WECHAT_APP_ID: ${WECHAT_APP_ID:?请在 .env.production 中设置 WECHAT_APP_ID}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:?请在 .env.production 中设置 WECHAT_APP_SECRET}
      MARD_PALETTE_FILE: /app/packages/mard-palette/data/mard-221.json
      PATTERN_STORAGE_DIR: /data/patterns
    volumes:
      - pattern-storage:/data/patterns
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [backend]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?请在 .env.production 中设置 API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]

networks:
  backend:

volumes:
  postgres-data:
  pattern-storage:
  caddy-data:
  caddy-config:
